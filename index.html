<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63ce"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<title>機器配置管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f7fb;color:#172033}
button,input,select{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh}.hide{display:none!important}
header{background:#fff;padding:14px 16px;border-bottom:1px solid #e5e9f0;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:#7a8494}main{padding:14px 14px 92px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.section,.mapward{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:13px}
.kpi{display:flex;justify-content:space-between}.kpi strong{font-size:28px}.blue{color:#0864d8}.green{color:#168a5a}.muted{color:#8b94a3}.title{font-weight:700;margin:17px 0 9px}
.wardgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ward{background:#fff;border:1px solid #cfe0f7;border-radius:11px;padding:10px 4px;text-align:center;font-weight:700;color:#1263bd}
.ward small{display:block;color:#8a94a5;font-size:10px;font-weight:500}.section{padding:0;overflow:hidden;margin-bottom:10px}.row{padding:11px 13px;border-top:1px solid #edf0f4;display:flex;justify-content:space-between;align-items:center}.row:first-child{border-top:0}
.row small{display:block;color:#7e8795;font-size:11px}.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:#eaf2ff;color:#1464c3}.use{background:#e7f7ef;color:#168a5a}.check{background:#fff3d8;color:#b87900}.bad{background:#ffe5e7;color:#c52d3a}
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:10px;border:1px solid #e1e6ef}.tabs button{flex:1;padding:9px;border:0;background:transparent;border-radius:9px}.tabs .on{background:#eaf2ff;color:#0864d8;font-weight:700}
.map{display:grid;gap:10px}.maphead{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}.beds{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.bed{border:1px solid #e7ebf1;border-radius:8px;padding:6px;font-size:10px}.hasV{border:2px solid #2b73d2}.hasP{border:2px solid #19a06b}
.roomchips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.room{padding:8px 2px;border:1px solid #dfe5ee;background:#fff;border-radius:8px}.room.on{background:#1263bd;color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:#fff;border-top:1px solid #e1e6ef;display:flex;padding:8px}.bottom button{flex:1;border:0;background:none;color:#687385;font-size:11px}.bottom .on{color:#0864d8;font-weight:700}
.primary{width:100%;padding:13px;border:0;border-radius:11px;background:#0864d8;color:white;font-weight:700;margin-top:10px}.back{border:0;background:none;color:#0864d8;padding:0}
input,select{width:100%;padding:12px;border:1px solid #dfe5ee;border-radius:10px;background:#fff;margin:6px 0 10px}.note{font-size:11px;color:#6e7888;background:#eef5ff;padding:10px;border-radius:10px;line-height:1.5}
.login{padding:30px 16px}.loginbox{background:#fff;border:1px solid #e1e6ef;border-radius:18px;padding:20px}.loginbox h2{text-align:center}.err{color:#c52d3a;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header id="hdr" class="hide"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>機器配置管理</h1><div id="sync" class="sub">Firebase共有版</div></div><button id="logout">ログアウト</button></div></header>
<main id="main"></main>
<nav id="nav" class="bottom hide"><button data-nav="home">⌂<br>ホーム</button><button data-nav="map">▦<br>機器マップ</button><button data-nav="list">☷<br>機器一覧</button><button data-nav="ce">▣<br>CE室</button></nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {"apiKey": "AIzaSyC68wPuJyc5LVawYBQ83yBg97xVTcpbRGw", "authDomain": "kiki-haichi.firebaseapp.com", "projectId": "kiki-haichi", "storageBucket": "kiki-haichi.firebasestorage.app", "messagingSenderId": "38083816609", "appId": "1:38083816609:web:712c500c1cf669349d54e0"};
const SHARED_EMAIL="ce-shared@example.com";
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const wards=["5A","6A","7A","8A","5B","6B","7B","ICU"];
const seed=[
{id:"V01",name:"人工呼吸器①",type:"V",status:"使用中",loc:["5A",3,1]},
{id:"V02",name:"人工呼吸器②",type:"V",status:"待機",loc:["CE室"]},
{id:"V03",name:"人工呼吸器③",type:"V",status:"点検中",loc:["HCU",2]},
{id:"V04",name:"人工呼吸器④",type:"V",status:"待機",loc:["6A",8,2]},
{id:"V05",name:"人工呼吸器⑤",type:"V",status:"使用中",loc:["ICU",7,1]},
{id:"V06",name:"人工呼吸器⑥",type:"V",status:"待機",loc:["CE室"]},
{id:"P01",name:"PM①",type:"P",status:"待機",loc:["CE室"]},
{id:"P02",name:"PM②",type:"P",status:"使用中",loc:["5A",3,2]},
{id:"P03",name:"PM③",type:"P",status:"使用中",loc:["HCU",2]},
{id:"P04",name:"PM④",type:"P",status:"待機",loc:["7B",5,1]}];
let devices=[],screen="home",filter="all",ward="5A",room=3,moveId=null,unsub=null;

const $=s=>document.querySelector(s);
function sc(s){return s==="使用中"?"use":s==="点検中"?"check":s==="故障・使用禁止"?"bad":""}
function dl(d){return (d.type==="V"?"🫁 ":"💚 ")+d.name}
function lt(d){const l=d.loc;if(!l)return"未設定";if(l[0]==="CE室")return"CE室";if(l[0]==="HCU")return"HCU "+l[1];if(l[0]==="OPE")return"OPE "+l[1];return `${l[0]} ${l[1]}号室 ベッド${l[2]}`}
function showLogin(msg=""){ $("#hdr").classList.add("hide");$("#nav").classList.add("hide");$("#main").innerHTML=`<div class="login"><div class="loginbox"><h2>🏥 機器配置管理</h2><p class="sub" style="text-align:center">CE共通パスワード</p><input id="pw" type="password" placeholder="パスワード"><button id="login" class="primary">ログイン</button><div class="err">${msg}</div><div class="note" style="margin-top:14px">画面ではパスワードだけ入力します。</div></div></div>`;$("#login").onclick=login;$("#pw").onkeydown=e=>{if(e.key==="Enter")login()}}
async function login(){try{await signInWithEmailAndPassword(auth,SHARED_EMAIL,$("#pw").value)}catch(e){showLogin("ログインできません。パスワードかFirebase設定を確認してください。")}}
async function seedIfEmpty(){const s=await getDocs(collection(db,"devices"));if(!s.empty)return;for(const d of seed)await setDoc(doc(db,"devices",d.id),{...d,updatedAt:serverTimestamp()})}
function startRT(){if(unsub)unsub();unsub=onSnapshot(collection(db,"devices"),s=>{devices=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.id.localeCompare(b.id));$("#sync").textContent="同期済み "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});render()})}
function tabs(){return `<div class="tabs"><button data-filter="V" class="${filter==="V"?"on":""}">人工呼吸器</button><button data-filter="P" class="${filter==="P"?"on":""}">体外式PM</button><button data-filter="all" class="${filter==="all"?"on":""}">すべて</button></div>`}
function home(){const v=devices.filter(d=>d.type==="V"),p=devices.filter(d=>d.type==="P");return `<div class="grid"><div class="card"><div class="kpi"><div><div class="muted">人工呼吸器</div><strong class="blue">${v.length}</strong> 台</div><div>🫁</div></div></div><div class="card"><div class="kpi"><div><div class="muted">体外式ペースメーカー</div><strong class="green">${p.length}</strong> 台</div><div>💚</div></div></div></div><div class="title">病棟</div><div class="wardgrid">${wards.map(w=>`<button class="ward" data-ward="${w}">${w}<small>1〜14号室<br>ベッド1〜4</small></button>`).join("")}</div><div class="title">その他</div><div class="grid"><button class="ward" data-special>HCU<small>1〜4</small></button><button class="ward" data-special>OPE室<small>1・2・3・5・HOR</small></button></div><div class="note" style="margin-top:10px">機器移動はFirestoreへ保存され、他端末にもリアルタイム反映されます。</div>`}
function mapWard(w){const ds=devices.filter(d=>d.loc?.[0]===w&&(filter==="all"||d.type===filter));if(!ds.length)return"";const keys=[...new Set(ds.map(d=>`${d.loc[1]}-${d.loc[2]}`))];return `<div class="mapward"><div class="maphead"><b>${w}病棟</b><span>${ds.length}台</span></div><div class="beds">${keys.map(k=>{const[r,b]=k.split("-"),a=ds.filter(d=>String(d.loc[1])===r&&String(d.loc[2])===b);return `<div class="bed ${a.some(d=>d.type==="V")?"hasV":""} ${a.some(d=>d.type==="P")?"hasP":""}"><b>${r}号室・ベッド${b}</b>${a.map(d=>`<div>${dl(d)}</div>`).join("")}</div>`}).join("")}</div></div>`}
function special(name){const ds=devices.filter(d=>d.loc?.[0]===name&&(filter==="all"||d.type===filter));if(!ds.length)return"";return `<div class="mapward"><div class="maphead"><b>${name}</b><span>${ds.length}台</span></div>${ds.map(d=>`<div>${lt(d)}　${dl(d)}</div>`).join("")}</div>`}
function map(){return tabs()+`<div class="map">${wards.map(mapWard).join("")}${special("HCU")}${special("OPE")}<div class="mapward"><div class="maphead"><b>CE室</b><span>${devices.filter(d=>d.loc?.[0]==="CE室"&&(filter==="all"||d.type===filter)).length}台</span></div></div></div>`}
function list(){const ds=devices.filter(d=>filter==="all"||d.type===filter);return tabs()+`<div class="section">${ds.map(d=>`<div class="row" data-move="${d.id}"><div><b>${dl(d)}</b><small>${lt(d)}</small></div><span class="pill ${sc(d.status)}">${d.status}</span></div>`).join("")}</div>`}
function ce(){const ds=devices.filter(d=>d.loc?.[0]==="CE室");return `<div class="title">CE室（未使用機器）</div><div class="section">${ds.map(d=>`<div class="row" data-move="${d.id}"><div><b>${dl(d)}</b><small>${d.id}</small></div><span class="pill ${sc(d.status)}">${d.status}</span></div>`).join("")}</div>`}
function wardView(){return `<button class="back" data-nav="home">‹ ホーム</button><h2>${ward}病棟</h2><div class="roomchips">${Array.from({length:14},(_,i)=>i+1).map(r=>`<button class="room ${room===r?"on":""}" data-room="${r}">${r}</button>`).join("")}</div><div class="section">${[1,2,3,4].flatMap(b=>devices.filter(d=>d.loc?.[0]===ward&&d.loc[1]===room&&d.loc[2]===b).map(d=>`<div class="row" data-move="${d.id}"><b>ベッド${b}　${dl(d)}</b><span class="pill ${sc(d.status)}">${d.status}</span></div>`)).join("")}</div><div class="note">機器があるベッドだけ表示します。</div>`}
function move(){const d=devices.find(x=>x.id===moveId);return `<button class="back" data-nav="list">‹ 戻る</button><h2>機器を移動</h2><div class="card"><b>${dl(d)}</b><div class="sub">${lt(d)}</div></div><select id="dest"><option value="">移動先</option>${wards.map(w=>`<option value="${w}">${w}病棟</option>`).join("")}<option value="HCU">HCU</option><option value="OPE">OPE室</option><option value="CE室">CE室</option></select><div id="extra"></div><button id="save" class="primary">この場所に移動</button>`}
function extra(v){if(wards.includes(v))$("#extra").innerHTML=`<select id="r">${Array.from({length:14},(_,i)=>`<option value="${i+1}">${i+1}号室</option>`).join("")}</select><select id="b">${[1,2,3,4].map(x=>`<option>${x}</option>`).join("")}</select>`;else if(v==="HCU")$("#extra").innerHTML=`<select id="s">${[1,2,3,4].map(x=>`<option>${x}</option>`).join("")}</select>`;else if(v==="OPE")$("#extra").innerHTML=`<select id="s">${["1","2","3","5","HOR"].map(x=>`<option>${x}</option>`).join("")}</select>`;else $("#extra").innerHTML=""}
async function saveMove(){const d=devices.find(x=>x.id===moveId),dest=$("#dest").value;if(!dest)return;let loc,status=d.status;if(wards.includes(dest))loc=[dest,+$("#r").value,+$("#b").value];else if(dest==="HCU"||dest==="OPE")loc=[dest,$("#s").value];else{loc=["CE室"];status="待機"};const from=lt(d);await setDoc(doc(db,"devices",d.id),{loc,status,updatedAt:serverTimestamp()},{merge:true});await addDoc(collection(db,"movementLogs"),{deviceId:d.id,deviceName:d.name,from,to:loc[0]==="CE室"?"CE室":loc.join(" / "),actor:"CE共通",createdAt:serverTimestamp()});screen="map"}
function render(){const m=$("#main");m.innerHTML=screen==="home"?home():screen==="map"?map():screen==="list"?list():screen==="ce"?ce():screen==="ward"?wardView():move();bind();document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.nav===screen))}
function bind(){document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{screen=b.dataset.nav;render()});document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll("[data-ward]").forEach(b=>b.onclick=()=>{ward=b.dataset.ward;room=3;screen="ward";render()});document.querySelectorAll("[data-special]").forEach(b=>b.onclick=()=>{screen="map";render()});document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{moveId=b.dataset.move;screen="move";render()});document.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>{room=+b.dataset.room;render()});if($("#dest"))$("#dest").onchange=e=>extra(e.target.value);if($("#save"))$("#save").onclick=saveMove}
$("#logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{if(!user){if(unsub)unsub();showLogin();return}$("#hdr").classList.remove("hide");$("#nav").classList.remove("hide");$("#main").innerHTML='<div class="note">機器データを読み込み中…</div>';await seedIfEmpty();startRT()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
